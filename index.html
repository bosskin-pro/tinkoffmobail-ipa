
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Установка TIMOB</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 25px;
    }
    .install {
      display: inline-block;
      background: #007aff;
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
    }
    p {
      font-size: 15px;
      color: #666;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Установка приложения на iPhone</h1>
    <a class="install" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/bosskin-pro/tinkoffmobail-ipa/main/manifest.plist">
      Установить
    </a>
    <p>Нажмите «Установить» и дождитесь окончания установки.</p>
  </div>
</body>
</html>
